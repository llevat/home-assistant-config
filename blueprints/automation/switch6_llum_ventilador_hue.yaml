blueprint:
  name: Interruptor Zigbee 6 botons (ZHA, Aqara Opple) — Llum + Ventilador + Hue
  description: >
    Controla un llum i un ventilador (idèntic al del blueprint de 4 botons)
    amb un interruptor Zigbee Aqara Opple de 6 botons via ZHA, i a més fa
    servir els botons 5 i 6 per controlar la intensitat d'un llum Hue
    independent (per Bluetooth, sense hub).

    Botó 1 (clic curt) → on/off llum
    Botó 2 (clic curt) → on/off ventilador
    Botó 2 (mantingut) → inverteix el sentit de gir del ventilador
    Botó 3 (clic curt) → puja velocitat ventilador
    Botó 4 (clic curt) → baixa velocitat ventilador
    Botó 5 (clic curt) → encén i puja la intensitat del llum Hue
    Botó 6 (clic curt) → baixa la intensitat del llum Hue
    Botó 6 (mantingut) → apaga el llum Hue

    El botó i el tipus de pulsació pel bip i pel canvi de color es trien
    lliurement als paràmetres del blueprint (per defecte: botó 1 mantingut
    pel bip, botó 1 doble clic pel canvi de color).

    Aquest interruptor Aqara funciona en mode "multi-state" de ZHA: els
    triggers de clic curt/doble fan servir els tipus "remote_button_alt_short_press"
    i "remote_button_alt_double_press" (amb "Alt"), i el de mantenir premut
    fa servir "remote_button_long_release" (confirmats al log del dispositiu).
  domain: automation
  input:
    remote:
      name: Interruptor Zigbee (6 botons, Aqara Opple)
      description: El dispositiu ZHA de l'interruptor.
      selector:
        device:
          integration: zha

    light_target:
      name: Llum (del mateix mòdul que el ventilador)
      selector:
        entity:
          domain: light

    fan_target:
      name: Ventilador
      selector:
        entity:
          domain: fan

    buzzer_switch:
      name: Interruptor del bip del ventilador
      description: >
        Entitat "switch" que activa/desactiva el so (bip) del mòdul del ventilador
        (normalment apareix com a "Sonido" al dispositiu Tuya).
      selector:
        entity:
          domain: switch

    buzzer_button:
      name: Botó pel bip
      default: button_1
      selector: &button_selector
        select:
          mode: dropdown
          options:
            - label: "Botó 1"
              value: button_1
            - label: "Botó 2"
              value: button_2
            - label: "Botó 3"
              value: button_3
            - label: "Botó 4"
              value: button_4
            - label: "Botó 5"
              value: button_5
            - label: "Botó 6"
              value: button_6

    buzzer_press_type:
      name: Tipus de pulsació pel bip
      default: remote_button_long_release
      selector: &press_type_selector
        select:
          mode: dropdown
          options:
            - label: "Clic curt"
              value: remote_button_alt_short_press
            - label: "Doble clic"
              value: remote_button_alt_double_press
            - label: "Mantingut"
              value: remote_button_long_release

    color_button:
      name: Botó pel canvi de color
      default: button_1
      selector: *button_selector

    color_press_type:
      name: Tipus de pulsació pel canvi de color
      default: remote_button_alt_double_press
      selector: *press_type_selector

    speed_step:
      name: Salt de velocitat del ventilador
      default: 25
      selector:
        number:
          min: 5
          max: 50
          step: 5
          unit_of_measurement: "%"
          mode: slider

    warm_temp:
      name: Blanc càlid
      default: 2700
      selector:
        number:
          min: 2000
          max: 6500
          step: 50
          unit_of_measurement: "K"

    mid_temp:
      name: Blanc neutre
      default: 4500
      selector:
        number:
          min: 2000
          max: 6500
          step: 50
          unit_of_measurement: "K"

    cool_temp:
      name: Blanc fred
      default: 6500
      selector:
        number:
          min: 2000
          max: 6500
          step: 50
          unit_of_measurement: "K"

    hue_light:
      name: Llum Hue independent
      description: Llum Hue (sense hub, per Bluetooth) que controlaran els botons 5 i 6.
      selector:
        entity:
          domain: light

    hue_brightness_step:
      name: Salt d'intensitat del llum Hue
      default: 15
      selector:
        number:
          min: 5
          max: 50
          step: 5
          unit_of_measurement: "%"
          mode: slider

mode: parallel
max_exceeded: silent

variables:
  fan_target: !input fan_target
  light_target: !input light_target
  buzzer_switch: !input buzzer_switch
  warm_temp: !input warm_temp
  mid_temp: !input mid_temp
  cool_temp: !input cool_temp
  hue_light: !input hue_light
  hue_brightness_step: !input hue_brightness_step

trigger:
  - platform: device
    domain: zha
    device_id: !input remote
    type: remote_button_alt_short_press
    subtype: button_1
    id: boto1
  - platform: device
    domain: zha
    device_id: !input remote
    type: remote_button_alt_short_press
    subtype: button_2
    id: boto2
  - platform: device
    domain: zha
    device_id: !input remote
    type: remote_button_alt_short_press
    subtype: button_3
    id: boto3
  - platform: device
    domain: zha
    device_id: !input remote
    type: remote_button_alt_short_press
    subtype: button_4
    id: boto4
  - platform: device
    domain: zha
    device_id: !input remote
    type: remote_button_alt_short_press
    subtype: button_5
    id: boto5
  - platform: device
    domain: zha
    device_id: !input remote
    type: remote_button_alt_short_press
    subtype: button_6
    id: boto6
  - platform: device
    domain: zha
    device_id: !input remote
    type: remote_button_long_release
    subtype: button_2
    id: boto2_llarg
  - platform: device
    domain: zha
    device_id: !input remote
    type: remote_button_long_release
    subtype: button_6
    id: boto6_llarg
  - platform: device
    domain: zha
    device_id: !input remote
    type: !input color_press_type
    subtype: !input color_button
    id: boto_color
  - platform: device
    domain: zha
    device_id: !input remote
    type: !input buzzer_press_type
    subtype: !input buzzer_button
    id: boto_buzzer

action:
  - choose:
      # Botó 1: toggle llum
      - conditions:
          - condition: trigger
            id: boto1
        sequence:
          - service: light.toggle
            target:
              entity_id: !input light_target

      # Botó 2: toggle ventilador
      - conditions:
          - condition: trigger
            id: boto2
        sequence:
          - service: fan.toggle
            target:
              entity_id: !input fan_target

      # Botó 3: puja velocitat
      - conditions:
          - condition: trigger
            id: boto3
        sequence:
          - service: fan.increase_speed
            target:
              entity_id: !input fan_target
            data:
              percentage_step: !input speed_step

      # Botó 4: baixa velocitat
      - conditions:
          - condition: trigger
            id: boto4
        sequence:
          - service: fan.decrease_speed
            target:
              entity_id: !input fan_target
            data:
              percentage_step: !input speed_step

      # Botó 5: encén i puja intensitat del llum Hue
      - conditions:
          - condition: trigger
            id: boto5
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input hue_light
            data:
              brightness_step_pct: !input hue_brightness_step

      # Botó 6: baixa intensitat del llum Hue
      - conditions:
          - condition: trigger
            id: boto6
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input hue_light
            data:
              brightness_step_pct: >-
                {{ hue_brightness_step | int * -1 }}

      # Botó 6 mantingut: apaga el llum Hue
      - conditions:
          - condition: trigger
            id: boto6_llarg
        sequence:
          - service: light.turn_off
            target:
              entity_id: !input hue_light

      # Botó 2 mantingut: inverteix el sentit de gir del ventilador
      - conditions:
          - condition: trigger
            id: boto2_llarg
        sequence:
          - service: fan.set_direction
            target:
              entity_id: !input fan_target
            data:
              direction: >
                {{ 'reverse' if state_attr(fan_target, 'direction') == 'forward' else 'forward' }}

      # Botó configurable: rota entre els 3 tons de blanc
      - conditions:
          - condition: trigger
            id: boto_color
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input light_target
            data:
              color_temp_kelvin: >-
                {% set c = state_attr(light_target, 'color_temp_kelvin') | float(warm_temp) %}
                {{ mid_temp if c < (warm_temp + mid_temp) / 2 else (cool_temp if c < (mid_temp + cool_temp) / 2 else warm_temp) }}

      # Botó configurable: activa/desactiva el bip del ventilador
      - conditions:
          - condition: trigger
            id: boto_buzzer
        sequence:
          - service: switch.toggle
            target:
              entity_id: !input buzzer_switch
