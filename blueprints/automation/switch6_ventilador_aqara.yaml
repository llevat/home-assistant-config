blueprint:
  name: Interruptor Zigbee 6 botons (ZHA, Aqara Opple) — Ventilador
  description: >
    Controla un ventilador amb un interruptor Zigbee Aqara Opple de 6 botons,
    connectat via ZHA. Pots assignar lliurement una acció (o cap) a cada
    botó (clic curt).

    Aquest interruptor funciona en mode "multi-state" de ZHA, que és el que
    permet distingir clic simple/doble/mantingut per separat. Per això els
    triggers de clic curt fan servir el tipus "remote_button_alt_short_press"
    (amb l'"Alt") en lloc del "remote_button_short_press" normal que fan
    servir altres interruptors (com el Tuya/Moes TS0044).

    Si en el futur vols afegir accions de doble clic o de mantenir premut,
    els tipus disponibles per aquest dispositiu són "remote_button_alt_double_press"
    i "remote_button_long_release" (confirmats al log del dispositiu).
  domain: automation
  input:
    remote:
      name: Interruptor Zigbee (6 botons, Aqara Opple)
      description: El dispositiu ZHA de l'interruptor.
      selector:
        device:
          integration: zha

    fan_target:
      name: Ventilador
      selector:
        entity:
          domain: fan

    buzzer_switch:
      name: Interruptor del bip del ventilador (opcional)
      description: >
        Només cal si vols assignar l'acció "Activar/desactivar bip" a algun
        botó. Deixa-ho buit si no s'utilitza.
      selector:
        entity:
          domain: switch

    speed_step:
      name: Salt de velocitat
      description: Percentatge que puja/baixa la velocitat a cada polsació.
      default: 25
      selector:
        number:
          min: 5
          max: 50
          step: 5
          unit_of_measurement: "%"
          mode: slider

    button1_action:
      name: Acció botó 1
      default: toggle
      selector: &action_selector
        select:
          mode: dropdown
          options:
            - label: "Cap acció"
              value: none
            - label: "Engegar / Aturar"
              value: toggle
            - label: "Pujar velocitat"
              value: increase_speed
            - label: "Baixar velocitat"
              value: decrease_speed
            - label: "Invertir sentit de gir"
              value: reverse_direction
            - label: "Activar/desactivar bip"
              value: buzzer_toggle

    button2_action:
      name: Acció botó 2
      default: increase_speed
      selector: *action_selector

    button3_action:
      name: Acció botó 3
      default: decrease_speed
      selector: *action_selector

    button4_action:
      name: Acció botó 4
      default: reverse_direction
      selector: *action_selector

    button5_action:
      name: Acció botó 5
      default: buzzer_toggle
      selector: *action_selector

    button6_action:
      name: Acció botó 6
      default: none
      selector: *action_selector

mode: parallel
max_exceeded: silent

variables:
  fan_target: !input fan_target
  buzzer_switch: !input buzzer_switch
  speed_step: !input speed_step
  button1_action: !input button1_action
  button2_action: !input button2_action
  button3_action: !input button3_action
  button4_action: !input button4_action
  button5_action: !input button5_action
  button6_action: !input button6_action

trigger:
  - platform: device
    domain: zha
    device_id: !input remote
    type: remote_button_alt_short_press
    subtype: button_1
    id: boto1
  - platform: device
    domain: zha
    device_id: !input remote
    type: remote_button_alt_short_press
    subtype: button_2
    id: boto2
  - platform: device
    domain: zha
    device_id: !input remote
    type: remote_button_alt_short_press
    subtype: button_3
    id: boto3
  - platform: device
    domain: zha
    device_id: !input remote
    type: remote_button_alt_short_press
    subtype: button_4
    id: boto4
  - platform: device
    domain: zha
    device_id: !input remote
    type: remote_button_alt_short_press
    subtype: button_5
    id: boto5
  - platform: device
    domain: zha
    device_id: !input remote
    type: remote_button_alt_short_press
    subtype: button_6
    id: boto6

action:
  - choose:
      # Botó 1
      - conditions:
          - condition: trigger
            id: boto1
        sequence:
          - choose:
              - conditions: "{{ button1_action == 'toggle' }}"
                sequence:
                  - service: fan.toggle
                    target:
                      entity_id: !input fan_target
              - conditions: "{{ button1_action == 'increase_speed' }}"
                sequence:
                  - service: fan.increase_speed
                    target:
                      entity_id: !input fan_target
                    data:
                      percentage_step: !input speed_step
              - conditions: "{{ button1_action == 'decrease_speed' }}"
                sequence:
                  - service: fan.decrease_speed
                    target:
                      entity_id: !input fan_target
                    data:
                      percentage_step: !input speed_step
              - conditions: "{{ button1_action == 'reverse_direction' }}"
                sequence:
                  - service: fan.set_direction
                    target:
                      entity_id: !input fan_target
                    data:
                      direction: >
                        {{ 'reverse' if state_attr(fan_target, 'direction') == 'forward' else 'forward' }}
              - conditions: "{{ button1_action == 'buzzer_toggle' }}"
                sequence:
                  - service: switch.toggle
                    target:
                      entity_id: !input buzzer_switch

      # Botó 2
